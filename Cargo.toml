[package]
name = "turbo-figma"
version = "1.1.1"
edition = "2021"
license = "MIT"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip"] }
sha2 = { version = "=0.11.1", default-features = false }
zstd = { version = "=0.14.3", default-features = false, features = ["vendored", "experimental"] }
# Already locked transitively by zstd-sys; used directly for diagnostic CPU/RSS.
libc = { version = "=0.2.191", default-features = false }
# Approved after the 2026-10-26 dependency security review.
unicode-normalization = { version = "=0.1.26", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "io-util", "io-std", "sync", "time", "macros"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
