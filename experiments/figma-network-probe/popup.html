<!doctype html>
<html lang="ru"><meta charset="utf-8">
<title>Figma Network Probe</title>
<style>body{font:14px system-ui;width:350px;padding:12px}button{display:block;width:100%;margin:10px 0;padding:9px}pre{white-space:pre-wrap}p{line-height:1.5}</style>
<h2>Figma Network Probe</h2>
<p>Запись только входящего multiplayer-обмена выбранного файла Figma. Старт перезагрузит файл. Дамп остаётся локально и может содержать данные макета и сессии внутри сообщений.</p>
<button id="start">Начать запись и перезагрузить Figma</button>
<button id="stop">Остановить запись</button>
<button id="save">Скачать дамп JSON</button>
<button id="clear">Удалить сохранённую запись</button>
<pre id="status"></pre>
<script src="popup.js"></script></html>
