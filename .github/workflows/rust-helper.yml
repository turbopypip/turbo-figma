name: Rust helper prototype
on: [push, pull_request]
jobs:
  helper:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: cargo +1.99.1 test --locked --manifest-path rust/helper/Cargo.toml
      - run: cargo +1.99.1 build --locked --release --manifest-path rust/helper/Cargo.toml
      - run: node --test tests/rust-helper.test.mjs
        env:
          REQUIRE_RUST_HELPER: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: rust-helper-${{ runner.os }}-${{ runner.arch }}
          path: |
            rust/helper/target/release/figma-rust-helper
            rust/helper/target/release/figma-rust-helper.exe
          if-no-files-found: error
