name: Rust MCP and browser extension
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup override set 1.99.1
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          REQUIRE_TURBO_FIGMA: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-figma-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/turbo-figma
            target/release/turbo-figma.exe
          if-no-files-found: error
