name: Rust MCP and browser extension
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.99.1 --profile minimal
      - run: rustup override set 1.99.1
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          REQUIRE_TURBO_FIGMA: '1'
      - run: npm run release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: turbo-figma-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: turbo-figma-*
          path: dist
          merge-multiple: true
      - name: Verify archives and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="$GITHUB_WORKSPACE/releases/${RELEASE_TAG#v}.md"
          test -s "$notes"
          cd dist
          archives=("turbo-figma-${RELEASE_TAG}-windows-x64.zip" "turbo-figma-${RELEASE_TAG}-linux-x64.tar.gz" "turbo-figma-${RELEASE_TAG}-macos-arm64.tar.gz")
          for archive in "${archives[@]}"; do test -s "$archive"; done
          sha256sum "${archives[@]}" > SHA256SUMS
          gh release create "$RELEASE_TAG" "${archives[@]}" SHA256SUMS --verify-tag --draft --notes-file "$notes" --title "turbo-figma $RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false --latest
